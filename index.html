<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>Calculator</title>

  <style>
    /* Размер всех символов на кнопках и SVG */
    .btn {
      font-size: 38px; /* цифры и знаки */
      line-height: 1;
    }

    .btn svg {
      width: 38px;
      height: 38px;
      stroke-width: 1.5; /* соответствует толщине цифр и знаков */
    }

    /* Стили меню Force */
    .menu {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .menuCard {
      background: #1c1c1e;
      padding: 20px;
      border-radius: 16px;
      width: 80%;
    }

    .menuCard input {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .menuBtns {
      display: flex;
      gap: 10px;
    }

    .menuBtn.resetBtn {
      flex: 1;
      background: #c7c7cc; /* серый в стиле iOS */
      color: #000;
      font-size: 18px;
      border-radius: 12px;
      padding: 10px 0;
    }

    .menuBtn.saveBtn {
      flex: 1;
      background: #ff9500; /* оранжевый iOS */
      color: #fff;
      font-size: 18px;
      border-radius: 12px;
      padding: 10px 0;
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <div class="display" id="display">0</div>

    <div class="keys" id="keys">
      <!-- Row 1 -->
      <button class="btn func backspace" data-k="backspace">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="38" height="38" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Контур стрелки -->
    <path d="M20 5H9.414a1 1 0 0 0-.707.293l-6 6a1 1 0 0 0 0 1.414l6 6a1 1 0 0 0 .707.293H20a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/>
    
    <!-- Крестик внутри сдвинут на 1px вправо и вниз -->
    <line x1="12" y1="10" x2="16" y2="14"/>
    <line x1="16" y1="10" x2="12" y2="14"/>
  </svg>
</button>
      <button class="btn func" data-k="ac">C</button>
      <button class="btn func" data-k="%">%</button>
      <button class="btn op" data-k="÷">÷</button>

      <!-- Row 2 -->
      <button class="btn digit" data-k="7">7</button>
      <button class="btn digit" data-k="8">8</button>
      <button class="btn digit" data-k="9">9</button>
      <button class="btn op" data-k="×">×</button>

      <!-- Row 3 -->
      <button class="btn digit" data-k="4">4</button>
      <button class="btn digit" data-k="5">5</button>
      <button class="btn digit" data-k="6">6</button>
      <button class="btn op" data-k="−">−</button>

      <!-- Row 4 -->
      <button class="btn digit" data-k="1">1</button>
      <button class="btn digit" data-k="2">2</button>
      <button class="btn digit" data-k="3">3</button>
      <button class="btn op" data-k="+">+</button>

      <!-- Row 5 -->
      <button class="btn digit pm" data-k="±">+/-</button>
      <button class="btn digit" data-k="0">0</button>
      <button class="btn digit comma" data-k=",">,</button>
      <button class="btn op" data-k="=">=</button>
    </div>
  </div>

  <!-- FORCE SECRET MENU -->
  <div class="menu" id="menu">
    <div class="menuCard">
      <input id="akalcInput" inputmode="numeric" placeholder="Напиши число здесь 😉" />

      <div class="menuBtns">
        <button class="menuBtn resetBtn" id="resetAkalc">Сбросить</button>
        <button class="menuBtn saveBtn" id="saveAkalc">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
